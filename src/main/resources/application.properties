# =====================================================================
# APPLICATION CONFIGURATION
# Spring Boot Employee Management System
# =====================================================================

# --- Server ---
server.port=8080
server.servlet.context-path=/

# --- Spring Application ---
spring.application.name=employee-management

# =====================================================================
# H2 IN-MEMORY DATABASE
# =====================================================================
spring.datasource.url=jdbc:h2:mem:employeedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# =====================================================================
# JPA / HIBERNATE
# =====================================================================
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# =====================================================================
# H2 CONSOLE — Access at http://localhost:8080/h2-console
# JDBC URL : jdbc:h2:mem:employeedb
# User     : sa
# Password : (leave blank)
# =====================================================================
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# =====================================================================
# EMAIL CONFIGURATION
# For development: set app.email.enabled=false to just log emails.
# For production: configure a real SMTP server below and set enabled=true.
# =====================================================================
app.email.enabled=false
app.email.from=noreply@employeemgmt.com
app.email.from-name=Employee Management System

# SMTP (uncomment and fill for real email)
 spring.mail.host=smtp.gmail.com
 spring.mail.port=587
 spring.mail.username=your-email@gmail.com
 spring.mail.password=your-app-password
 spring.mail.properties.mail.smtp.auth=true
 spring.mail.properties.mail.smtp.starttls.enable=true

# Fallback SMTP (used when app.email.enabled=false — points to a no-op)
#spring.mail.host=localhost
#spring.mail.port=1025

# =====================================================================
# FILE UPLOAD
# =====================================================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# =====================================================================
# SWAGGER / OPENAPI — Access at http://localhost:8080/swagger-ui.html
# =====================================================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.try-it-out-enabled=true

# =====================================================================
# LOGGING
# =====================================================================
logging.level.com.assessment.employee=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{requestId}] %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{requestId}] %logger{36} - %msg%n
logging.file.name=logs/employee-management.log

# =====================================================================
# BUSINESS RULES (configurable)
# =====================================================================
app.business.salary.floor.default=30000
app.business.salary.floor.intern=15000

# =====================================================================
# ASYNC / THREAD POOL (for async email)
# =====================================================================
app.async.core-pool-size=2
app.async.max-pool-size=5
app.async.queue-capacity=100
